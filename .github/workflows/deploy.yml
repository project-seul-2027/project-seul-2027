# Pubblica il sito su GitHub Pages a ogni push sul ramo main.
# Prima volta: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # cronologia completa: serve a calcolare i numeri di versione del Changelog
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Dopo la pubblicazione avvisa chi ha attivato le notifiche. Serve il segreto FIREBASE_SERVICE_ACCOUNT
  # (senza, questo passaggio non fa nulla). Per un commit senza avviso: scrivi [no-push] nel messaggio.
  notify:
    needs: deploy
    if: ${{ !contains(github.event.head_commit.message, '[no-push]') }}
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/checkout@v4
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: npm install --no-save --no-package-lock firebase-admin@13
      - if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: node scripts/send-push.mjs
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECT_BUILD: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
