# Capsula del tempo: avvisi a 100, 50, 30, 14, 7 e 1 giorno dalla partenza (1 marzo 2027).
# Alle 18:00 italiane si apre il traguardo; alle 16:00 italiane, due giorni dopo (46 ore), parte l'avviso
# "sta per chiudere", solo per chi non ha ancora risposto né saltato.
# GitHub esegue i controlli programmati "quando può": il 21 novembre l'unico è partito oltre quattro ore tardi.
# Per questo si controlla ogni mezz'ora durante tutto il giorno (7:00-23:59 UTC) dall'apertura alla chiusura;
# lo script manda l'avviso se è scattato da meno di 24 ore (apertura) o 110 minuti (chiusura), non di notte in Italia,
# e mai due volte (pushLog).
# Prova a mano: GitHub → Actions → "Capsula del tempo" → Run workflow (con "solo elenco" non manda nulla).
name: Capsula del tempo

on:
  schedule:
    - cron: '*/30 7-23 21-23 11 *'   # 100 giorni: dal 21 al 23 novembre 2026
    - cron: '*/30 7-23 10-12 1 *'    # 50 giorni: dal 10 al 12 gennaio 2027
    - cron: '*/30 7-23 30,31 1 *'    # 30 giorni: 30 gennaio...
    - cron: '*/30 7-23 1 2 *'        # ...fino all'1 febbraio
    - cron: '*/30 7-23 15-17 2 *'    # 14 giorni: dal 15 al 17 febbraio
    - cron: '*/30 7-23 22-24 2 *'    # 7 giorni: dal 22 al 24 febbraio
    - cron: '*/30 7-23 28 2 *'       # 1 giorno: 28 febbraio...
    - cron: '*/30 7-23 1,2 3 *'      # ...fino al 2 marzo
  workflow_dispatch:
    inputs:
      dry_run:
        description: Solo elenco, non manda niente
        type: boolean
        default: true
      now_iso:
        description: Data e ora da simulare (facoltativo, es. 2026-11-21T18:05:00+01:00)
        required: false

# Un invio alla volta: due controlli insieme potrebbero mandare lo stesso avviso due volte
concurrency:
  group: capsule-push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepara
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps firebase-admin@13 esbuild@0.25
          npx esbuild scripts/capsule-push.mts --bundle --platform=node --format=esm --target=node22 \
            --external:firebase-admin --outfile=capsule-push.bundle.mjs
      - name: Invia
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          export SITE_URL="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/"
          node capsule-push.bundle.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          NOW_ISO: ${{ inputs.now_iso }}
